# Publishes DGT Study Desk to GitHub Pages on every push to main (or by hand from the Actions tab).
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the code, write to Pages, and prove to Pages that this run is who it says it is.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Regenerates topics/*.html, js/topics/*.js and js/catalog.js from tools/, so the site is
      # up to date even if `npm run build` was forgotten before pushing. Python stdlib only.
      - name: Build topic pages
        run: python3 tools/build_site.py

      # Only what the browser needs. tools/, server.js and pdf/ stay out (the pages don't link the PDFs).
      - name: Collect site files
        run: |
          mkdir _site
          cp -R index.html css js topics _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
